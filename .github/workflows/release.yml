# On a tag like v0.2.0: build release binaries for Windows and Linux and
# attach them to a GitHub Release with that name. Each platform gets an
# archive with the docs and the bare program, which `telemetrix update`
# downloads. SHA256SUMS lists the checksum of every file.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
    env:
      PACKAGE: telemetrix-${{ github.ref_name }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/telemetrix.exe"
          New-Item -ItemType Directory -Path "pkg/$env:PACKAGE", dist | Out-Null
          Copy-Item -Path $exe, README.md, LICENSE-MIT, LICENSE-APACHE, telemetrix.example.toml -Destination "pkg/$env:PACKAGE"
          Compress-Archive -Path "pkg/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip"
          Copy-Item -Path $exe -Destination "dist/$env:PACKAGE.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/telemetrix"
          mkdir -p "pkg/$PACKAGE" dist
          cp "$exe" README.md LICENSE-MIT LICENSE-APACHE telemetrix.example.toml "pkg/$PACKAGE/"
          tar -czf "dist/$PACKAGE.tar.gz" -C pkg "$PACKAGE"
          cp "$exe" "dist/$PACKAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # One job creates the release, so the two builds never race to create it.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `telemetrix update` refuses a download whose checksum is not here.
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
