[package]
name = "telemetrix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "TermSaver: ultra-lightweight terminal screensaver and live system telemetry dashboard"

[dependencies]
lexopt = "0.3.2"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "component"] }
toml_edit = "0.25.15"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
